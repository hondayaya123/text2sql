# JOIN 路徑推薦（for Text2SQL）
recommended_paths:
  - query_intent: "查詢批次良率與Bin分佈"
    path: "CP_LOT → CP_WAFER → CP_BIN_SUMMARY"
    sql: |
      SELECT l.*, w.YIELD, b.BIN_NO, b.DIE_COUNT
      FROM CP_LOT l
      JOIN CP_WAFER w ON l.LOT_ID = w.LOT_ID
      JOIN CP_BIN_SUMMARY b ON w.LOT_ID = b.LOT_ID AND w.WAFER_ID = b.WAFER_ID
      
  - query_intent: "查詢參數測試結果與規格比較"
    path: "WAT_LOT → WAT_RESULT ← WAT_PARAM"
    sql: |
      SELECT l.LOT_ID, r.PARAM_ID, p.PARAM_NAME, r.MEAS_VALUE, p.LSL, p.USL
      FROM WAT_LOT l
      JOIN WAT_RESULT r ON l.LOT_ID = r.LOT_ID
      JOIN WAT_PARAM p ON r.PARAM_ID = p.PARAM_ID
